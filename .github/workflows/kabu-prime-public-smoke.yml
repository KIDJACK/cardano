name: Temporary Kabu Prime public reconnaissance

on:
  push:
    branches:
      - agent/kabu-prime-public-exec-20260826
    paths:
      - '.github/workflows/kabu-prime-public-smoke.yml'
      - 'tools/kabu_prime_recon.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe public data sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UA='Mozilla/5.0 (compatible; KabuPrimeBacktest/1.0; research-only)'
          curl -A "$UA" -L --retry 3 --retry-delay 2 --max-time 60 -fsS 'https://kabu-sokuhou.com/home/index/isort___2ch/ilimit___12/' -o out/kabu.html
          curl -A "$UA" -L --retry 3 --retry-delay 2 --max-time 60 -fsS 'https://query1.finance.yahoo.com/v8/finance/chart/7203.T?period1=1661385600&period2=1787616000&interval=1d&events=history' -o out/yahoo.json
          curl -A "$UA" -L --retry 3 --retry-delay 2 --max-time 60 -fsS 'https://www.jpx.co.jp/markets/statistics-equities/misc/tvdivq0000001vg2-att/data_j.xls' -o out/jpx.xls
          python tools/kabu_prime_recon.py | tee out/recon.log
          wc -c out/*
      - name: Upload reconnaissance evidence
        uses: actions/upload-artifact@v4
        with:
          name: kabu-prime-public-recon-${{ github.run_id }}
          path: out/
          retention-days: 1
