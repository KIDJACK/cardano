name: Temporary Kabu Prime public backtest

on:
  push:
    branches:
      - agent/kabu-prime-public-exec-20260826
    paths:
      - '.github/workflows/kabu-prime-public-smoke.yml'
      - 'tools/kabu_prime_recon.py'
      - 'tools/apply_kabu_prime_fixes.py'
      - '.github/kabu-prime-source/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kabu-prime-public-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis dependencies
        run: python -m pip install --quiet beautifulsoup4 pandas numpy matplotlib

      - name: Reconstruct, transform, and verify backtest program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/source
          cat .github/kabu-prime-source/part-*.b64 > /tmp/kabu_prime.b64
          base64 --decode /tmp/kabu_prime.b64 > /tmp/kabu_prime_backtest.py.gz
          echo 'de8a156d4e2f4c8f360aac8915b6894aa305d8a666b636495cc4b395bfc1861d  /tmp/kabu_prime_backtest.py.gz' | sha256sum --check --strict
          gzip -dc /tmp/kabu_prime_backtest.py.gz > /tmp/kabu_prime_backtest.py
          echo '377c41cc1f02738ffde452d171cd3fde4302f85726a46740bd9c9a8730c9642b  /tmp/kabu_prime_backtest.py' | sha256sum --check --strict
          python tools/apply_kabu_prime_fixes.py /tmp/kabu_prime_backtest.py
          echo '515b6cbda6c19a8f8cec1394429c12289dfe33a65b6c06a3eaab568749b77aae  /tmp/kabu_prime_backtest.py' | sha256sum --check --strict
          python -m py_compile /tmp/kabu_prime_backtest.py
          cp /tmp/kabu_prime_backtest.py out/source/
          cp tools/apply_kabu_prime_fixes.py out/source/
          cp .github/kabu-prime-source/*.patch out/source/ || true
          sha256sum out/source/* > out/source/source.sha256

      - name: Enumerate archived ranking snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/kabu_prime_recon.py | tee out/recon.log

      - name: Run point-in-time Prime backtest
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/kabu_prime_backtest.py \
            --captures out/captures-selected.json \
            --output out/final \
            --cache out/cache \
            --archive-delay 1.0 \
            --price-delay 0.35 \
            --slippage 0.001 \
            2>&1 | tee out/backtest.log

      - name: Add result to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f out/final/summary.md ]]; then
            cat out/final/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Final summary was not produced; inspect the artifact and logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'purpose=temporary public computation of generic public-market backtest'
            echo "commit=$GITHUB_SHA"
            echo 'source_transformer=tools/apply_kabu_prime_fixes.py'
            echo 'ranking_day_ohlc_used_for_features=0'
            echo 'synthetic_cross_window_rank_signal=0'
            echo 'same_day_target_after_intraday_limit_fill=0'
            echo 'right_censored_holding_periods=0'
            echo 'confidence_interval_resampling=signal_date_cluster'
            echo 'minimum_train_trades=30'
            echo 'minimum_validation_trades=15'
            echo 'broker_connections=0'
            echo 'orders=0'
            echo 'account_data=0'
            echo 'discord_notifications=0'
          } > out/run-manifest.txt
          find out -type f ! -path 'out/cache/*' ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > out/evidence.sha256 || true

      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kabu-prime-public-backtest-${{ github.run_id }}
          path: |
            out/final/
            out/source/
            out/recon-summary.json
            out/captures-selected.json
            out/recon.log
            out/backtest.log
            out/run-manifest.txt
            out/evidence.sha256
          retention-days: 1
          if-no-files-found: warn
